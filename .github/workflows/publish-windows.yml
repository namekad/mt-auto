name: Publish Windows build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip ; python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build
        env:
          GIT_SHA: ${{ github.sha }}
        run: pyinstaller --noconfirm trade-aut.spec

      - name: Pack
        run: python scripts/pack_release.py dist/TelegramMT5 TelegramMT5.zip

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "build-${{ github.sha }}" TelegramMT5.zip --title "${{ github.sha }}" --notes "Windows app build"
